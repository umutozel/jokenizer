name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# npm trusted publishing (OIDC): the publish step mints a short-lived
# token from this workflow's GitHub identity — no stored NPM_TOKEN, no
# expiry. Requires the one-time counterpart on npmjs.com:
# package jokenizer -> Settings -> Trusted Publisher ->
# GitHub Actions / umutozel/jokenizer / build.yml
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs a recent npm CLI (>= 11.5); the bundled
      # one may lag behind.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Upload coverage to Codecov
        run: npm run codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
